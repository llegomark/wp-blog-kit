# The actions in .github/workflows are pinned to commit SHAs; Dependabot opens a pull request
# when a new release comes out, so the pins don't go stale. The same for the npm tools
# (package-lock.json: linters, Playwright) and the Composer tools (composer.lock: coding
# standards, PHPStan, PHPUnit). The checks run on each such PR. New releases wait 14 days first,
# so a compromised release is likely caught before it gets here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: CI
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      lint-tools:
        patterns: ['*']
    commit-message:
      prefix: Lint tools
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      php-tools:
        patterns: ['*']
    commit-message:
      prefix: PHP tools
