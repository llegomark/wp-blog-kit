# The actions in .github/workflows are pinned to commit SHAs; Dependabot opens a pull request
# when a new release comes out, so the pins don't go stale. The same for the npm lint tools
# (package-lock.json). The checks run on each such PR. New releases wait 14 days first, so a
# compromised release is likely caught before it gets here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: CI
    cooldown:
      default-days: 14
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      lint-tools:
        patterns: ['*']
    commit-message:
      prefix: Lint tools
