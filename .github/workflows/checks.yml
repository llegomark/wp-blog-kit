# The same checks as `composer check`, `npm run lint` and the tests, on GitHub's servers: WordPress
# Coding Standards and PHPStan level 8 for the PHP, WordPress's CSS and JavaScript standards
# (Stylelint, ESLint), theme.json and block.json against WordPress's schemas with the patterns and
# block markup, the plugins' readmes by WordPress.org's readme rules, each product's versions against
# each other, WordPress's Plugin Check for the
# plugins, the PHPUnit integration tests on WordPress's test framework, and the browser tests
# (Playwright) on the demo site.
# Every action is pinned to a full commit SHA (the comment names the release); Dependabot
# proposes updates (.github/dependabot.yml). The database image is pinned by its digest.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 01:00 UTC (09:00 Manila), even when nothing changed: everything again, and the two
    # looks ahead at WordPress's next release (Plugin Check on trunk, PHPUnit on the nightly build).
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# A newer run replaces an older one of the same kind. The event is part of the group: the weekly
# run is on main too, and without it would cancel a push's run that is still going, the one the
# release waits for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: Coding standards and PHPStan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5 (the version the servers run)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install the tools from composer.lock
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: WordPress Coding Standards
        run: composer lint

      - name: PHPStan level 8
        run: composer analyse

  frontend:
    name: CSS, JavaScript and theme files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (the version in .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no package runs code while installing (the pre-commit hook isn't needed here).
      - name: Install the tools from package-lock.json
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Stylelint (WordPress CSS coding standards)
        run: npm run lint:css

      - name: ESLint (WordPress JavaScript coding standards)
        run: npm run lint:js

      - name: theme.json, block.json, patterns and block markup
        run: npm run lint:theme

      - name: Plugin readme (WordPress.org's readme validator rules)
        run: npm run lint:readme

      - name: Each product's versions agree (header, constant, Stable tag, changelog)
        run: npm run lint:versions

      - name: Tests of the release tools
        run: npm run test:tooling

  phpunit:
    name: PHPUnit (WordPress latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A throwaway database for the tests (they empty it on every run). The image is pinned by its
    # digest (the tag names the release), like the actions: a tag can be pointed at another image.
    # Dependabot doesn't update service images, so a newer 8.4 release is taken by hand: the tag's
    # index digest from https://hub.docker.com/_/mysql/tags?name=8.4, in all three jobs.
    services:
      database:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5 (the version the servers run)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: mysqli, gd, exif, intl, zip
          tools: composer:v2, wp-cli

      - name: Install the tools from composer.lock
        run: composer install --no-interaction --no-progress --prefer-dist

      # Downloads WordPress into .cache/wordpress, creates the test database, then runs PHPUnit.
      - name: PHPUnit integration tests
        run: composer test

  # WordPress's next release, from its nightly build: on the day it ships, the jobs above switch to it
  # with no commit to blame. This one says so beforehand. It runs only on the weekly and manual
  # runs, so it never holds up a push, a pull request or a release, and it fails like any other job:
  # a red weekly run is the warning.
  phpunit-next:
    name: PHPUnit (WordPress nightly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      database:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      WP_TESTS_DB_HOST: 127.0.0.1:3306
      WP_TESTS_DB_USER: root
      WP_TESTS_DB_PASSWORD: root
      WP_VERSION: nightly
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5 (the version the servers run)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: mysqli, gd, exif, intl, zip
          tools: composer:v2, wp-cli

      - name: Install the tools from composer.lock
        run: composer install --no-interaction --no-progress --prefer-dist

      # tests/bin/install-wp-tests.sh downloads the nightly build for WP_VERSION=nightly.
      - name: PHPUnit integration tests on the nightly build
        run: composer test

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      database:
        image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    # dev/site.sh and the tests' WP-CLI calls use this database server.
    env:
      WP_DEV_DB_HOST: 127.0.0.1:3306
      WP_DEV_DB_USER: root
      WP_DEV_DB_PASSWORD: root
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP 8.5 (the version the servers run)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          extensions: mysqli, gd, exif, intl, zip
          tools: wp-cli

      - name: Set up Node (the version in .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # --ignore-scripts: no package runs code while installing. Playwright uses the runner's own
      # Google Chrome, so no browser is downloaded either.
      - name: Install the tools from package-lock.json
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Create the demo site (dev/site.sh)
        run: dev/site.sh

      # Starts the site with dev/serve.sh (playwright.config.mjs).
      - name: Browser tests
        run: npm run test:e2e

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: .cache/playwright/
          retention-days: 7

  plugin-check:
    name: Plugin Check (${{ matrix.plugin }}, WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: [tala-seo, tala-ads, tala-guard]
        wordpress: [latest, trunk]
    # trunk is the WordPress release in development: a finding there is an early warning, not a
    # failed build.
    continue-on-error: ${{ matrix.wordpress == 'trunk' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The action's wp-env otherwise runs PHP 8.3, where a plugin that requires PHP 8.5 can't be
      # activated. wp-env reads this file next to the .wp-env.json the action writes.
      - name: Run WordPress on PHP 8.5 (the version the servers run)
        run: |
          echo '{ "phpVersion": "8.5" }' > .wp-env.override.json

      - name: Plugin Check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ./${{ matrix.plugin }}
          wp-version: ${{ matrix.wordpress }}
          include-experimental: true
          # Deliberate: "Update URI: false" keeps this private plugin from ever being "updated"
          # by an unrelated wordpress.org plugin of the same name (as in dev/plugin-check.sh).
          ignore-codes: plugin_updater_detected
